services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: klio-postgres
    environment:
      POSTGRES_USER: klio
      POSTGRES_PASSWORD: klio_dev_password
      POSTGRES_DB: klio
    ports:
      - "5433:5432"
    volumes:
      - klio-postgres-data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klio -d klio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: klio-redis
    ports:
      - "6380:6379"
    volumes:
      - klio-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local embedding + extraction model server.
  #
  # IMPORTANT: this service is opt-in via the `docker-ollama` profile.
  # `docker compose up -d` does NOT start it. Two reasons:
  #
  #   1. On macOS, Docker runs in a Linux VM that cannot reach Metal,
  #      so the container falls back to CPU and is 5-10× slower than a
  #      native `brew install ollama`. The Makefile targets prefer the
  #      native install on Darwin and fall back to this profile on Linux.
  #   2. On Linux without an NVIDIA GPU passthrough config, Docker
  #      Ollama is also CPU-only, so it offers no speed advantage over
  #      a native `apt install` / direct binary either. The container
  #      is here for portability (CI, WSL, headless boxes) — explicit
  #      opt-in only.
  #
  # To use anyway: `docker compose --profile docker-ollama up -d ollama`
  ollama:
    image: ollama/ollama:latest
    container_name: klio-ollama
    profiles: [docker-ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - klio-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Klio engine — FastAPI app exposing the REST API consumed by the
  # MCP shim, the Go bridge daemon, and the trust-app. Boots after
  # postgres + redis are healthy. Migrations run inside the container
  # via `alembic upgrade head` in /entrypoint.sh.
  #
  # Why we mount a named volume at /var/lib/klio:
  # the dev KMS master key (used to wrap each user's envelope key)
  # is persisted there. Restarting the container without persistence
  # would invalidate every wrapped key in the database — every
  # encrypted entry would become unrecoverable. Production deployments
  # replace this with a real KMS (AWS, GCP) by setting kms_key_arn.
  #
  # Ollama: the engine reaches the host's native Ollama via
  # `host.docker.internal`. On macOS Docker Desktop wires that name
  # automatically; on Linux we need the `extra_hosts` entry below to
  # make it resolve to the host gateway.
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: klio-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KLIO_DATABASE_URL: postgresql+asyncpg://klio:klio_dev_password@postgres:5432/klio
      KLIO_REDIS_URL: redis://redis:6379/0
      KLIO_JWT_SIGNING_KEY: ${KLIO_JWT_SIGNING_KEY:-dev-only-secret-replace-me}
      KLIO_EMBEDDING_MODEL: ${KLIO_EMBEDDING_MODEL:-ollama/nomic-embed-text}
      KLIO_OLLAMA_API_BASE: ${KLIO_OLLAMA_API_BASE:-http://host.docker.internal:11434}
      KLIO_DEV_KMS_PATH: /var/lib/klio/dev-kms.key
      KLIO_LOG_LEVEL: ${KLIO_LOG_LEVEL:-INFO}
    volumes:
      - klio-engine-data:/var/lib/klio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Bridge — Go daemon + MCP shim, packaged as a container so the
  # npm-launched onboarding flow doesn't have to ship platform-specific
  # binaries. Hooks fired by Claude Code/Cursor reach this container
  # via `docker exec klio-bridge klio hook <event>`; the MCP shim is
  # invoked the same way (`docker exec -i klio-bridge klio-mcp`).
  #
  # The unix socket lives inside the container at /data/bridge.sock,
  # backed by a named volume. We DO NOT bind-mount it to the host
  # because:
  #   - the agent adapters configure Claude Code/Cursor to invoke
  #     `docker exec`, which runs inside the container — the daemon
  #     and the hook subcommand share the socket through normal
  #     intra-container IPC, no host plumbing needed
  #   - bind-mounting unix sockets across Docker Desktop's Linux VM
  #     barrier is fragile (the socket inode lives in two filesystems
  #     simultaneously and notify+accept semantics differ between
  #     host and VM)
  #
  # ~/.claude is bind-mounted read-only at /host/.claude so `klio
  # backfill` can walk session JSONL files without copying them in.
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: klio-bridge
    depends_on:
      engine:
        condition: service_healthy
    environment:
      KLIO_API_URL: http://engine:8000
      KLIO_REDIS_URL: redis://redis:6379/0
      KLIO_LOG_LEVEL: ${KLIO_LOG_LEVEL:-INFO}
    volumes:
      - klio-bridge-data:/data
      - ${HOME}/.claude:/host/.claude:ro
    # Keep the daemon alive for `docker exec` invocations even when
    # no agent is currently connected. `restart: unless-stopped`
    # means user-issued `docker compose stop` is honored but a
    # daemon panic auto-recovers.
    restart: unless-stopped

  # Compression proxy — sits between your coding agent and
  # api.anthropic.com. `klio init` points ANTHROPIC_BASE_URL at it.
  #
  # SHIPS PASS-THROUGH ONLY. It forwards traffic unchanged; the
  # compressors plug into proxy/src/klio_proxy/seam.py in a later stage.
  #
  # Three things about this service differ from the rest of the stack,
  # all for the same reason — once ANTHROPIC_BASE_URL points here, a
  # dead proxy means the agent cannot reach a model at all:
  #
  #   1. No `depends_on`. The proxy needs neither postgres, redis, nor
  #      the engine. A database that fails to come up must not be able
  #      to take the user's agent offline with it.
  #   2. `restart: unless-stopped`, so a crash self-heals and a Docker
  #      Desktop restart brings it back. The host-side launchd/systemd
  #      unit written by `klio init` covers the case Docker cannot:
  #      the Docker daemon itself not running after a reboot.
  #   3. Published on 127.0.0.1 only. The proxy forwards your Anthropic
  #      credentials; on 0.0.0.0 the machine becomes an open relay for
  #      anyone who can reach the port.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: klio-proxy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      KLIO_PROXY_UPSTREAM_URL: ${KLIO_PROXY_UPSTREAM_URL:-https://api.anthropic.com}
      KLIO_PROXY_HOST: 0.0.0.0
      KLIO_PROXY_PORT: 8787
    restart: unless-stopped

  # Trust app — Next.js dashboard for browsing your memories, spaces,
  # and access requests. Talks to the engine on the compose network
  # (service name `engine`), which is also reachable on the host at
  # http://127.0.0.1:8000 for the MCP shim + bridge daemon.
  #
  # Auto-authenticates in local-dev mode using KLIO_LOCAL_USER_ID /
  # KLIO_LOCAL_AGENT_ID from a project-level `.env` file (populated by
  # `klio init`; can also be filled in by hand from `klio status`).
  #
  # Reach it at http://127.0.0.1:3000 once the engine is up.
  trust-app:
    build:
      context: ./trust-app
      dockerfile: Dockerfile
    container_name: klio-trust-app
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      KLIO_ENGINE_URL: http://engine:8000
      KLIO_JWT_SIGNING_KEY: ${KLIO_JWT_SIGNING_KEY:-dev-only-secret-replace-me}
      KLIO_LOCAL_DEV: "1"
      KLIO_LOCAL_USER_ID: ${KLIO_LOCAL_USER_ID}
      KLIO_LOCAL_AGENT_ID: ${KLIO_LOCAL_AGENT_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  klio-postgres-data:
  klio-redis-data:
  klio-ollama-data:
  klio-engine-data:
  klio-bridge-data:
