services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: klio-postgres
    environment:
      POSTGRES_USER: klio
      POSTGRES_PASSWORD: klio_dev_password
      POSTGRES_DB: klio
    ports:
      - "5433:5432"
    volumes:
      - klio-postgres-data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klio -d klio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: klio-redis
    ports:
      - "6380:6379"
    volumes:
      - klio-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local embedding + extraction model server. Speaks the OpenAI-compatible
  # API on :11434, which LiteLLM routes to via the `ollama/<model>` prefix.
  # Pull models with `make ollama-pull` after the container is up.
  ollama:
    image: ollama/ollama:latest
    container_name: klio-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - klio-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  klio-postgres-data:
  klio-redis-data:
  klio-ollama-data:
