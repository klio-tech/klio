# Build + push the three Klio container images to GHCR.
#
# Why GHCR (and not Docker Hub): the klio-tech GitHub org already
# owns the namespace, GITHUB_TOKEN is auto-provisioned per workflow
# run with the right `packages:write` scope, and pulls from GHCR
# don't have the rate-limit ceiling that Docker Hub enforces on
# anonymous users — important for the `npx @klio-tech/klio init`
# happy path where a fresh user pulls all three images at once.
#
# Triggers:
#   - push to main           → :main + :sha-<short> (rolling pre-release)
#   - tag push v*            → :v0.1.0 + :latest   (stable release)
#   - manual workflow_dispatch (for re-publishing without a code change)
#
# The matrix runs three independent jobs in parallel (one per image).
# Each job uses the same recipe: setup-buildx, login, metadata-action,
# build-push with multi-arch (linux/amd64 + linux/arm64) and GHA-cache.
#
# Build time: ~3-4 min cold, ~30-60 sec warm (cached). Total wall
# time matches the slowest job (engine, due to pip + cryptography).

name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
    # Skip the run when only docs / non-build files change. Keeps the
    # CI bill predictable and avoids spurious image churn.
    #
    # `npm/package.json` is included because the version field there
    # drives the image tag we publish (see the metadata-action step
    # below). A version bump in package.json must re-tag the images
    # even if no engine/bridge/trust-app source changed, otherwise
    # `npx @klio-tech/klio@<new-version>` would 404 on its image pull.
    paths:
      - 'engine/**'
      - 'bridge/**'
      - 'trust-app/**'
      - 'docker-compose.yml'
      - 'npm/package.json'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

# Cancel stale runs on the same ref so a rapid push to main doesn't
# stack up four parallel builds — only the latest commit ships.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Org owns klio-engine / klio-bridge / klio-trust-app under
  # ghcr.io/klio-tech. The image short name is the matrix `name`.
  ORG: klio-tech

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      # `packages:write` is the magic GHA permission that lets the
      # default GITHUB_TOKEN push to ghcr.io. Without it the docker
      # login step succeeds but the push 401s.
      contents: read
      packages: write
    strategy:
      # `fail-fast: false` so a transient network blip on one image
      # doesn't kill the others — partial publish is recoverable
      # (re-run the failed job in the GHA UI).
      fail-fast: false
      matrix:
        include:
          - name: klio-engine
            context: ./engine
          - name: klio-bridge
            context: ./bridge
            # Bake the build version into /etc/klio-version inside
            # the image. The bridge daemon reads this file first
            # (env second, default third) so `klio status` and the
            # auto-update ticker report the version that's actually
            # running, regardless of whether the operator's compose
            # template threaded KLIO_BRIDGE_VERSION through.
            #
            # The actual KLIO_VERSION value is appended below in the
            # build step so we can interpolate `steps.pkg.outputs.version`
            # — matrix-scoped expressions can't reference step outputs.
            needs_version_arg: true
          - name: klio-trust-app
            context: ./trust-app
            build_args: |
              KLIO_BUILD_TARGET=local
          - name: klio-landing
            context: ./trust-app
            build_args: |
              KLIO_BUILD_TARGET=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU registers binfmt handlers so a single ubuntu-24.04 amd64
      # runner can build linux/arm64 images via emulation. Slower than
      # a native arm64 runner but free; acceptable for now (engine
      # arm64 takes ~4 min vs ~2 min native).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx is the modern Docker builder; needed for multi-platform
      # builds and for the `cache-to: type=gha` step that stores layer
      # blobs in GHA's own cache backend (no S3 / Cloudflare R2 needed).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the version from npm/package.json so the same value that
      # the npm launcher uses to pin its image tag (compose template
      # writes `image: ghcr.io/klio-tech/klio-engine:${version}`) is
      # also what every main-branch image push gets tagged with.
      #
      # That way bumping `npm/package.json` from 0.1.0 → 0.1.1 is the
      # ONE action a release needs: the npm publish workflow ships
      # @klio-tech/klio@0.1.1 to npm, this workflow re-tags every image
      # as :0.1.1 on GHCR, and `npx @klio-tech/klio@0.1.1 init` pulls a
      # matched set without any manual `git tag v0.1.1 && git push`.
      - name: Read npm package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved npm/package.json version: $VERSION"

      # metadata-action computes the tag list automatically from the
      # event:
      #   branch=main  → :main, :sha-<short>, :<npm-version>, :latest
      #   tag=v0.1.0   → :v0.1.0, :0.1.0, :0.1, :sha-<short>, :latest
      #
      # Why include :<npm-version> + :latest on main pushes (not only
      # on tag pushes): the npm package's compose template references
      # the version tag directly, so every npm-package version bump
      # MUST have a matching image tag on GHCR. Cutting a separate git
      # tag per release works but is extra friction; auto-tagging
      # from package.json keeps the release surface to one file change.
      #
      # Caveat: pushing two commits with the same package.json version
      # will overwrite each other's :<version> tag. That's intentional
      # — semver expects one tag per published version, and we want
      # `npx @klio-tech/klio@0.1.0` to always pull whatever shipped
      # under that version label. Bumping the version is the trigger
      # for "this is a real release, freeze the tag."
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          # Multi-arch: amd64 covers most CI/x86 servers + Intel Macs;
          # arm64 covers Apple Silicon + Graviton + Raspberry Pi.
          # Skip linux/arm/v7 (32-bit) — pip wheels for cryptography
          # and asyncpg do not publish armv7 builds, so the engine
          # image build would fail on that platform.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Two sources of build-args composed into a single multiline
          # string (docker/build-push-action concatenates lines into
          # a list of KEY=value pairs):
          #
          #   1. matrix.build_args — per-image static args (e.g.
          #      KLIO_BUILD_TARGET=local for trust-app).
          #   2. KLIO_VERSION (bridge only) — the npm package.json
          #      version we already resolved in the `pkg` step.
          #      Conditional because matrix-scoped expressions cannot
          #      reference step outputs (the matrix is materialised
          #      before steps run), so we resolve at the step level
          #      and emit the build-arg only for the image whose
          #      Dockerfile declares `ARG KLIO_VERSION`.
          #
          # The `||  ''` branch keeps the line empty (rather than the
          # literal text `false`) for non-bridge images, which the
          # build-arg parser silently ignores.
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.needs_version_arg && format('KLIO_VERSION={0}', steps.pkg.outputs.version) || '' }}
          # GHA cache keeps inter-run layer cache so a rerun of the
          # workflow on the same Dockerfile completes in <1 min.
          # `mode=max` writes intermediate stage layers too, not just
          # the final image — important for the engine image whose
          # `deps` stage is the expensive bit.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false  # SBOM attestations bloat manifest-list
                             # for marginal value; revisit when CISA
                             # SBOM mandates land for OSS dependencies.
