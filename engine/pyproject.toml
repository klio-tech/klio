[project]
name = "klio-engine"
version = "0.0.1"
description = "Klio substrate engine — the local-first, encrypted, MCP-native memory layer for AI agents."
readme = "../README.md"
authors = [{ name = "Abhishek Singh", email = "contact@klio.tech" }]
maintainers = [{ name = "Abhishek Singh", email = "contact@klio.tech" }]
license = { text = "AGPL-3.0-or-later" }
keywords = [
    "ai-agents",
    "memory",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "cursor",
    "rag",
    "vector-database",
    "pgvector",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "cryptography>=43",
    "structlog>=24",
    "redis>=5",
    "python-jose[cryptography]>=3.3",
]

[project.urls]
Homepage      = "https://klio.tech"
Repository    = "https://github.com/klio-tech/klio"
Documentation = "https://github.com/klio-tech/klio#readme"
Issues        = "https://github.com/klio-tech/klio/issues"
Changelog     = "https://github.com/klio-tech/klio/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres,redis]>=4.8",
    "moto[kms,s3]>=5.0",
    "fakeredis>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klio_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-x"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:botocore.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
